<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>Kuri Fashion — Tiendas independientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="edition.css">
  <link rel="stylesheet" href="iteration.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Kuri Fashion, volver a la portada">Kuri <span>Fashion</span></a>
    <button id="open-index" aria-haspopup="dialog" aria-controls="brand-index">Firmas <i aria-hidden="true"></i></button>
    <nav aria-label="Navegación principal">
      <a href="#/" class="nav-home">Tiendas</a>
      <a href="#/categorias" class="nav-home">Categorías</a>
    </nav>
    <a class="edition cart-nav" href="#/carrito">Bolsa (<span class="cart-count">0</span>)</a>
  </header>
  <dialog id="brand-index" aria-labelledby="index-title">
    <div class="index-heading"><h2 id="index-title">Índice de firmas</h2><form method="dialog"><button autofocus aria-label="Cerrar índice">Cerrar ×</button></form></div>
    <nav id="brand-links" aria-label="Firmas"></nav>
    <a class="index-categories" href="#/categorias">Ver por categoría →</a>
  </dialog>
  <main id="app"></main>
  <footer class="site-footer"><span>Kuri Fashion</span><span>Moda independiente, vista de cerca.</span><span>2026</span></footer>
</body>
</html>
